<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#510d21"><title>Chúc mừng sinh nhật Kim Loan</title><link rel="stylesheet" href="style.css?v=3"></head>
<body>
<div class="grain" aria-hidden="true"></div><div class="ambient" aria-hidden="true"><i>✧</i><i>✦</i><i>✧</i><i>✦</i><i>✧</i><i>✦</i></div><div id="confetti" aria-hidden="true"></div>
<header><button id="music" class="music" aria-label="Bật nhạc">♫ <span>Bật nhạc</span></button></header>
<main>
<section class="home" id="home">
 <div class="eyebrow">MỘT NGÀY ĐẶC BIỆT · MỘT NGƯỜI BẠN ĐẶC BIỆT</div>
 <h1>Happy <em>birthday!</em></h1>
 <p class="dedication">Gửi <span id="friend">Kim Loan</span><span class="dedication-dot"> · </span> <span id="subtitle"></span></p>
 <div class="stage">
  <div class="side-note left-note">a little older,<br>a lot cooler!<span>↓</span></div>
  <figure class="polaroid p-left"><img src="assets/photo-3.jpg" alt="Một khoảnh khắc của bạn" fetchpriority="high"><figcaption>stay golden ✧</figcaption></figure>
  <div class="center-note"><span class="spark">✧</span><p>Hôm nay có<br><em>quà cho cậu.</em></p><span class="small">CHỌN MỘT BẤT NGỜ BÊN DƯỚI</span><span class="arrow">↓</span></div>
  <figure class="polaroid p-right"><img src="assets/photo-1.jpg" alt="Ảnh sinh nhật dành tặng bạn" fetchpriority="high"><figcaption>the birthday star ★</figcaption></figure>
  <div class="side-note right-note">good vibes<br>only.<span>✶</span></div>
 </div>
 <nav class="gifts" aria-label="Chọn quà sinh nhật">
  <button data-open="letter"><span class="gift-art envelope" aria-hidden="true"><i>✳</i></span><strong>Một lá thư</strong><small>Có vài điều muốn nói</small></button>
  <button data-open="flowers"><span class="gift-art bouquet" aria-hidden="true"><img src="assets/bouquet.svg" alt=""></span><strong>Một bó hoa</strong><small>Tặng cậu chút rực rỡ</small></button>
  <button data-open="cake"><span class="gift-art cake-icon" aria-hidden="true"><img src="assets/cake.svg" alt=""></span><strong>Một điều ước</strong><small>Nhắm mắt, ước đi nào!</small></button>
  <button data-open="album"><span class="gift-art mini-photo" aria-hidden="true"><img src="assets/photo-7.jpg" alt=""></span><strong>Một cuốn album</strong><small>Những khoảnh khắc của cậu</small></button>
 </nav>
 <footer>MADE WITH GOOD VIBES & A LITTLE CONFETTI <span>✳</span> FROM <b id="from"></b></footer>
</section>
</main>
<dialog id="giftDialog"><button class="close" aria-label="Đóng">✕</button><div id="giftContent"></div></dialog>
<p id="soundStatus" class="sound-status" role="status"></p>
<audio id="audio" loop preload="none"></audio>
<script src="config.js"></script><script src="illustrations.js"></script><script src="app.js?v=3"></script>
</body></html>
